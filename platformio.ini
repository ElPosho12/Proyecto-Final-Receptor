; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
lib_deps =
  bodmer/TFT_eSPI
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library

; Configuración de TFT_eSPI vía build_flags (reemplaza al User_Setup.h)
; Pines de control (CS/DC/RST) iguales a los usados antes con Adafruit.
; Pines de bus SPI (SCK/MOSI/MISO) = VSPI por defecto del ESP32.
; Si tu pantalla está cableada a otros pines de SCK/MOSI, cambialos acá.
build_flags =
  -DUSER_SETUP_LOADED=1
  -DST7735_DRIVER=1
  -DST7735_GREENTAB=1
  -DTFT_WIDTH=128
  -DTFT_HEIGHT=128
  -DTFT_CS=27
  -DTFT_DC=26
  -DTFT_RST=-1
  -DTFT_MOSI=25
  -DTFT_SCLK=14
  -DTFT_MISO=-1
  -DSPI_FREQUENCY=27000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1